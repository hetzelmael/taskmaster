# === docker-compose.prod.yml — Orchestration production ===
# Différences vs docker-compose.yml :
#   - Aucun port hôte pour db, cache et backend (réseau interne uniquement)
#   - Nginx seul exposé sur 80 et 443
#   - Backend ciblé sur le stage "production" du Dockerfile
#   - Pas de hot-reload (pas de volumes source en écriture)

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: taskmaster-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_ADMIN_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Pas de ports: — db inaccessible depuis l'hôte

  cache:
    image: redis:7-alpine
    container_name: taskmaster-cache
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    # Pas de ports: — Redis inaccessible depuis l'hôte

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: taskmaster-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SALT_ROUNDS: ${SALT_ROUNDS:-12}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DATABASE_URL: postgres://${DB_APP_USER}:${DB_APP_PASSWORD}@db:5432/${DB_NAME}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
    # Pas de ports: — backend inaccessible depuis l'hôte, Nginx fait le proxy

  frontend:
    image: nginx:alpine
    container_name: taskmaster-front
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro   # Certificats TLS montés en lecture seule
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
